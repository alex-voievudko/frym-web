<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Frym">
  <!-- The mark from Logo.astro at 64px: ink tile, green waterline 30% up. -->
  <defs>
    <clipPath id="tile">
      <rect width="64" height="64" rx="19.2" ry="19.2"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#141718"/>
    <rect y="39.87" width="64" height="4.93" fill="#AAB5A4"/>
  </g>
</svg>
